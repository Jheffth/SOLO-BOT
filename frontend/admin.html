<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Solo Bot — Administração</title>
<meta name="theme-color" content="#06060b">
<link rel="icon" href="/static/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/solo.css">
<link rel="stylesheet" href="/static/painel.css">
</head>
<body>
<header class="topo">
  <div class="dentro">
    <a class="marca" href="/painel"><span class="logo"></span><b>Solo</b><span>Bot</span></a>
    <nav id="nav"></nav>
    <div class="direita">
      <button class="btn fantasma pequeno" id="tema" aria-label="Alternar tema"></button>
      <div class="quem" id="quem"></div>
      <button class="btn fantasma pequeno" id="sair" title="Sair"></button>
    </div>
  </div>
</header>

<main class="painel">
  <section class="saudacao entrar-animado">
    <div><span class="eyebrow">Administração</span><h1>Sala de <span class="grad">máquinas</span></h1>
      <p class="muted">Canais, sistemas e a saúde do bot.</p></div>
    <button class="btn pequeno" id="atualizar"><span data-i="activity"></span>Atualizar</button>
  </section>

  <div class="numeros" id="numeros"></div>

  <div class="cartoes dois" style="margin-bottom:28px">
    <article class="cartao vidro canal" style="--c:#229ed9" id="tg"></article>
    <article class="cartao vidro canal" style="--c:#1faa59" id="wa"></article>
  </div>

  <section class="cartao vidro entrar-animado voz-admin" id="voz-admin" style="margin-bottom:28px">
    <div class="linha entre" style="flex-wrap:wrap;gap:10px">
      <div><h2>Voz do bot</h2><p class="muted pequeno" style="margin:4px 0 0">ElevenLabs · vale para todos os sistemas.</p></div>
      <button class="btn pequeno" id="voz-recarregar"><span data-i="activity"></span>Atualizar saldo</button>
    </div>
    <div id="voz-corpo"><div class="esqueleto" style="height:160px;margin-top:16px"></div></div>
  </section>

  <section class="cartao vidro entrar-animado">
    <div class="linha entre"><h2>Sistemas registrados</h2><span class="linha" style="gap:.5rem"><span id="voz"></span><button class="btn pequeno" id="sincronizar"><span data-i="activity"></span>Buscar manifestos</button></span></div>
    <div style="overflow-x:auto"><table class="tabela" id="sistemas"></table></div>
  </section>
</main>

<script src="/static/solo.js"></script>
<script src="/static/topo.js"></script>
<script>
(async function () {
  const { icon, api, esc, toast, carregando } = Solo;
  const conta = await Solo.topo("admin");
  if (!conta.admin) return location.replace("/painel");

  const estado = (ok, sim, nao) => `<span class="chip ${ok ? "ok" : "aguarda"}">${ok ? '<span class="ponto"></span>' : ""}${ok ? sim : nao}</span>`;

  async function carregar() {
    const s = await api("/api/admin/status");
    const n = (rotulo, valor) => `<div class="numero vidro"><small>${rotulo}</small><b>${valor ?? "—"}</b></div>`;
    document.getElementById("numeros").innerHTML =
      n("Contas Solo", s.contas) + n("Comandos em 24 h", s.mensagens_24h) +
      n("No Telegram", s.telegram.contas) + n("No WhatsApp", s.whatsapp.contas);

    const t = s.telegram;
    const webhookOk = t.webhook && t.webhook.includes("/api/telegram/webhook");
    document.getElementById("tg").innerHTML = `
      <div class="linha entre"><span class="marca-canal">${icon("telegram")}</span>${estado(t.configurado && webhookOk, "Recebendo", t.configurado ? "Webhook desligado" : "Não configurado")}</div>
      <h3>Telegram ${t.usuario ? `<span class="muted" style="font-weight:500">@${esc(t.usuario)}</span>` : ""}</h3>
      <dl class="dl"><dt>Webhook</dt><dd class="mono pequeno">${esc(t.webhook || "—")}</dd>
        <dt>Na fila</dt><dd>${t.pendentes ?? "—"}</dd><dt>Último erro</dt><dd>${esc(t.ultimo_erro || "nenhum")}</dd></dl>
      <div class="rodape"><button class="btn pequeno primario" id="ligar-tg" ${t.configurado ? "" : "disabled"}>${icon("link")}${webhookOk ? "Religar webhook" : "Ligar webhook"}</button></div>`;

    const w = s.whatsapp;
    const ROTULO_WA = { open: "Conectado", connecting: "Aguardando o QR", close: "Desconectado",
      inexistente: "Instância não criada", inacessivel: "Evolution fora do alcance", chave_invalida: "Chave da Evolution recusada" };
    w.rotulo = ROTULO_WA[w.estado] || w.estado;
    const aberto = w.estado === "open";
    document.getElementById("wa").innerHTML = `
      <div class="linha entre"><span class="marca-canal">${icon("whatsapp")}</span>${estado(aberto, "Conectado", w.configurado ? (w.rotulo || "Desconectado") : "Não configurado")}</div>
      <h3>WhatsApp ${w.numero ? `<span class="muted" style="font-weight:500">+${esc(w.numero)}</span>` : ""}</h3>
      ${w.qr && !aberto ? `<div class="qr" style="margin:0"><img alt="QR do WhatsApp" src="${esc(w.qr)}"></div><p class="muted pequeno">WhatsApp → Aparelhos conectados → Conectar aparelho.</p>`
        : `<dl class="dl"><dt>Instância</dt><dd class="mono pequeno">Evolution</dd><dt>Estado</dt><dd>${esc(w.rotulo || "—")}</dd></dl>`}
      <div class="rodape"><button class="btn pequeno ${aberto ? "" : "primario"}" id="ligar-wa" ${w.configurado ? "" : "disabled"}>${icon("qr")}${aberto ? "Reaplicar webhook" : "Gerar QR"}</button></div>`;

    document.getElementById("voz").innerHTML = (s.voz.transcricao
      ? '<span class="chip ok"><span class="ponto"></span>Ouve áudio</span>'
      : '<span class="chip aguarda">Não ouve: defina GEMINI_API_KEY ou GROK_API_KEY</span>') + ' ' +
      (s.voz.fala
        ? (s.voz.fala_erro ? `<span class="chip aguarda" title="${esc(s.voz.fala_erro)}">Fala com erro</span>` : '<span class="chip ok"><span class="ponto"></span>Fala (ElevenLabs)</span>')
        : '<span class="chip aguarda">Não fala: defina ELEVENLABS_API_KEY</span>');
    document.getElementById("sistemas").innerHTML = `<tr><th>Sistema</th><th>Endereço interno</th><th>Token</th><th>Manifesto</th><th>Contas</th></tr>` +
      s.sistemas.map(m => `<tr><td><span class="linha" style="gap:.6rem"><span style="font-size:1.2rem">${esc(m.emoji)}</span><b style="font-weight:550">${esc(m.nome)}</b><code>/${esc(m.chave)}</code></span></td>
        <td class="mono pequeno muted">${esc(m.url)}</td><td>${m.configurado ? '<span class="chip ok">definido</span>' : '<span class="chip aguarda">faltando</span>'}</td>
        <td>${m.manifesto ? `<span class="mono pequeno">${esc(m.manifesto.versao)}</span>${s.voz.sistemas_com_audio.includes(m.chave) ? ' <span class="chip ok" title="Recebe o áudio bruto">🎤 áudio próprio</span>' : ''}<br><small class="faint">${m.manifesto.comandos} comandos · ${Solo.tempoRelativo(m.manifesto.recebido_em)}</small>` : '<span class="chip aguarda">nunca recebido</span>'}</td>
        <td>${m.contas}</td></tr>`).join("");

    document.getElementById("ligar-tg").onclick = async function () {
      carregando(this, true);
      try { const r = await api("/api/admin/telegram/webhook", { method: "POST" }); toast(r.ok ? "Webhook do Telegram ligado." : (r.description || "O Telegram recusou."), r.ok ? "ok" : "erro"); }
      catch (e) { toast(e.message, "erro"); }
      carregar();
    };
    document.getElementById("ligar-wa").onclick = async function () {
      carregando(this, true);
      try {
        const r = await api("/api/admin/whatsapp/conectar", { method: "POST" });
        if (!r.webhook_ok && r.estado !== "open") toast(r.detalhe || "A Evolution recusou o webhook.", "erro");
        else if (r.qr) toast("QR pronto: escaneie em até 20 segundos. Se vencer, clique de novo.");
        else toast(r.detalhe || "Webhook aplicado.", r.estado === "open" ? "ok" : "erro");
      } catch (e) { toast(e.message, "erro"); }
      await carregar();
      // O QR também chega pelo webhook: olha de novo por alguns segundos.
      for (let i = 0; i < 5; i++) { await new Promise(res => setTimeout(res, 2000)); await carregar(); }
    };
  }

  document.getElementById("sincronizar").onclick = async function () {
    carregando(this, true);
    try {
      const r = await api("/api/admin/manifestos/sincronizar", { method: "POST" });
      toast(Object.entries(r).map(([k, v]) => `${k}: ${v}`).join(" · "));
    } catch (e) { toast(e.message, "erro"); }
    carregando(this, false);
    carregar();
  };
  document.getElementById("atualizar").onclick = () => carregar().then(() => toast("Atualizado."));
  // ── Voz: saldo, modelo e vozes (carrega uma vez; a ElevenLabs cobra por consulta de voz, não de saldo)
  const fmt = n => Number(n || 0).toLocaleString("pt-BR");
  const CAT = { cloned: "Clonada", generated: "Criada", premade: "Padrão", professional: "Biblioteca" };
  let tocando = null;
  function tocar(url, btn) {
    if (tocando) { tocando.pause(); tocando = null; document.querySelectorAll(".voz-play.on").forEach(b => b.classList.remove("on")); }
    const a = new Audio(url); tocando = a; btn && btn.classList.add("on");
    a.onended = () => btn && btn.classList.remove("on");
    a.play().catch(() => toast("Não consegui tocar a amostra.", "erro"));
  }
  async function carregarVoz() {
    const alvo = document.getElementById("voz-corpo");
    let v;
    try { v = await api("/api/admin/voz"); } catch (e) { alvo.innerHTML = `<p class="muted">${esc(e.message)}</p>`; return; }
    if (!v.disponivel) { alvo.innerHTML = '<p class="muted" style="margin-top:14px">Defina <code>ELEVENLABS_API_KEY</code> no .env do Solo Bot para o bot falar.</p>'; return; }

    const conta = v.conta || { atual: "automatica", opcoes: [] };
    const contas = [{ id: "automatica", nome: "Automática" }, ...conta.opcoes];
    if (!contas.some(c => c.id === conta.atual)) contas.push({ id: conta.atual, nome: "Conta indisponível — escolha outra" });
    const saldo = v.creditos.map(c => {
      if (c.erro) return `<div class="saldo vidro"><div class="saldo-topo"><b>${esc(c.nome || c.rotulo)}</b></div><p class="muted pequeno">${esc(c.erro)}</p></div>`;
      const pct = c.limite ? Math.min(100, Math.round(c.restantes / c.limite * 100)) : 0;
      const tom = pct < 10 ? "baixo" : pct < 30 ? "medio" : "ok";
      return `<div class="saldo vidro ${tom}">
        <div class="saldo-topo"><b>${esc(c.nome || c.rotulo)}</b><span class="chip">${esc(c.plano || "—")}</span></div>
        <div class="saldo-num"><b>${fmt(c.restantes)}</b><span>de ${fmt(c.limite)} caracteres</span></div>
        <div class="saldo-barra"><i style="width:${pct}%"></i></div>
        <small class="faint">${pct}% restante${c.renova_em ? ` · renova em ${new Date(c.renova_em + "T12:00:00").toLocaleDateString("pt-BR")}` : ""}
          · ≈ ${fmt(Math.floor(c.restantes / 90))} respostas faladas</small>
      </div>`;
    }).join("");

    const modelos = v.modelo.opcoes.map(m => `
      <label class="modelo ${m.id === v.modelo.atual ? "on" : ""}">
        <input type="radio" name="modelo" value="${esc(m.id)}" ${m.id === v.modelo.atual ? "checked" : ""} ${v.modelo.fixo_no_env ? "disabled" : ""}>
        <span><b>${esc(m.nome)}</b>${m.expressivo ? ' <span class="chip ok">jeitos de falar</span>' : ""}<small>${esc(m.descricao)}</small></span>
      </label>`).join("");

    const fixa = v.voz.origem === "env";
    const sis = v.voz_sistema || { id: v.voz.id, origem: "mesma" };
    const eSistema = id => sis.origem === "tela" && id === sis.id;
    const vozes = v.vozes.map(x => `
      <div class="voz-item ${x.voice_id === v.voz.id ? "atual" : ""}">
        <button class="voz-play" ${x.preview_url ? `data-preview="${esc(x.preview_url)}"` : "disabled"} title="Ouvir a amostra da ElevenLabs (não gasta crédito)">${icon("play")}</button>
        <div class="voz-info"><b>${esc(x.nome)}</b><small>${esc(CAT[x.categoria] || x.categoria || "")}${x.descricao ? " · " + esc(x.descricao) : ""}</small>
          ${x.biblioteca ? '<span class="chip aguarda" title="No plano gratuito a API recusa vozes da Biblioteca (erro 402).">exige plano pago</span>' : ""}</div>
        <div class="voz-acoes">
          ${x.voice_id === v.voz.id ? '<span class="chip ok"><span class="ponto"></span>em uso</span>'
            : `<button class="btn pequeno" data-usar="${esc(x.voice_id)}" ${fixa ? "disabled" : ""}>Usar</button>`}
          ${eSistema(x.voice_id) ? '<span class="chip sussurro" title="A voz dos Ecos: quando o Sistema cobra">👁 Sistema</span>'
            : `<button class="btn pequeno fantasma" data-sistema="${esc(x.voice_id)}" title="Usar esta voz nos sussurros do Sistema">👁</button>`}
        </div>
      </div>`).join("") || '<p class="muted">Nenhuma voz na conta da ElevenLabs.</p>';

    alvo.innerHTML = `
      <h3 style="margin:22px 0 10px">Conta de voz</h3>
      <div class="linha" style="flex-wrap:wrap">
        <label for="voz-conta">Usar conta</label>
        <select id="voz-conta">${contas.map(c => `<option value="${esc(c.id)}" ${c.id === conta.atual ? "selected" : ""}>${esc(c.nome)}</option>`).join("")}</select>
        <button class="btn pequeno primario" id="voz-conta-salvar">Aplicar conta</button>
      </div>
      <p class="muted pequeno">Automática tenta a principal, a secundária e as demais, nessa ordem, quando faltam créditos ou ocorre uma falha. Ao escolher uma conta, somente ela será usada em todos os sistemas.</p>
      <p class="muted pequeno">Ao trocar, as vozes escolhidas no painel voltam à seleção automática da conta. Você pode escolhê-las novamente abaixo. Novas contas configuradas no servidor aparecem nesta lista.</p>
      <div class="saldos">${saldo || '<p class="muted">Sem chave para consultar.</p>'}</div>
      <div class="voz-grade">
        <div>
          <h3 style="margin:22px 0 10px">Modelo</h3>
          ${v.modelo.fixo_no_env ? '<p class="muted pequeno">Fixado no .env (<code>ELEVENLABS_MODEL</code>). Tire de lá para escolher aqui.</p>' : ""}
          <div class="modelos">${modelos}</div>
          <h3 style="margin:22px 0 10px">Testar a frase</h3>
          <div class="linha" style="flex-wrap:wrap">
            <div class="entrada" style="flex:1;min-width:200px"><span>${icon("chat")}</span><input id="voz-frase" maxlength="200" value="Lancei quarenta e cinco reais no mercado. Faltam duas missões hoje."></div>
            <button class="btn pequeno primario" id="voz-testar">Ouvir</button>
          </div>
          <small class="faint">Gasta créditos: é a frase de verdade, na voz e no modelo escolhidos.</small>

          <div class="sussurro-caixa">
            <h3 style="margin:0 0 4px">👁 Voz do Sistema <span class="muted pequeno" style="font-weight:500">· ${esc(sis.origem === "tela" ? (sis.nome || sis.id) : "a mesma do bot")}</span></h3>
            <p class="muted pequeno" style="margin:0 0 10px">Os sussurros (os Ecos do Rotinas) saem nesta voz, baixos e instáveis${v.modelo.opcoes.find(m => m.id === v.modelo.atual)?.expressivo ? ", sussurrados de verdade pelo modelo expressivo" : ". No modelo Expressivo, ela sussurra de verdade"}. Escolha com o 👁 na lista.</p>
            <div class="linha" style="flex-wrap:wrap">
              <div class="entrada" style="flex:1;min-width:200px"><span>${icon("chat")}</span><input id="sussurro-frase" maxlength="200" value="Fio dental. O Sistema anotou."></div>
              <button class="btn pequeno" id="sussurro-testar">Ouvir o sussurro</button>
              ${sis.origem === "tela" ? '<button class="btn pequeno fantasma" id="sussurro-limpar" title="Volta a usar a voz do bot">Usar a do bot</button>' : ""}
            </div>
          </div>
          ${v.ultimo_erro ? `<p class="erro-form" style="margin-top:10px">Última falha: ${esc(v.ultimo_erro)}</p>` : ""}
        </div>
        <div>
          <h3 style="margin:22px 0 10px">Vozes <span class="muted pequeno" style="font-weight:500">· em uso: ${esc(v.voz.nome || v.voz.id || "—")}${fixa ? " (fixada no .env)" : v.voz.origem === "automatica" ? " (automática)" : ""}</span></h3>
          <div class="vozes">${vozes}</div>
        </div>
      </div>`;

    document.getElementById("voz-conta-salvar").onclick = async function () {
      carregando(this, true);
      try {
        await api("/api/admin/voz", { method: "PUT", body: { conta: document.getElementById("voz-conta").value } });
        toast("Conta de voz atualizada.");
        await carregarVoz();
      } catch (e) { carregando(this, false); toast(e.message, "erro"); }
    };
    alvo.querySelectorAll("[data-preview]").forEach(b => b.onclick = () => tocar(b.dataset.preview, b));
    alvo.querySelectorAll("[data-usar]").forEach(b => b.onclick = async () => {
      carregando(b, true);
      try { await api("/api/admin/voz", { method: "PUT", body: { voice_id: b.dataset.usar } }); toast("Voz trocada para todos os sistemas."); carregarVoz(); }
      catch (e) { carregando(b, false); toast(e.message, "erro"); }
    });
    const vozSistema = async (id, b) => {
      if (b) carregando(b, true);
      try { await api("/api/admin/voz", { method: "PUT", body: { voice_id_sistema: id } }); toast(id ? "Voz do Sistema trocada." : "O Sistema volta a falar com a voz do bot."); carregarVoz(); }
      catch (e) { if (b) carregando(b, false); toast(e.message, "erro"); }
    };
    alvo.querySelectorAll("[data-sistema]").forEach(b => b.onclick = () => vozSistema(b.dataset.sistema, b));
    const limpar = document.getElementById("sussurro-limpar");
    if (limpar) limpar.onclick = () => vozSistema("", limpar);
    document.getElementById("sussurro-testar").onclick = async function () {
      carregando(this, true);
      try {
        const r = await fetch("/api/admin/voz/amostra", { method: "POST", credentials: "same-origin",
          headers: { "Content-Type": "application/json" }, body: JSON.stringify({ texto: document.getElementById("sussurro-frase").value, tom: "sussurro" }) });
        if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || "Não gerou a amostra.");
        tocar(URL.createObjectURL(await r.blob()));
      } catch (e) { toast(e.message, "erro"); }
      carregando(this, false);
    };
    alvo.querySelectorAll('input[name="modelo"]').forEach(r => r.onchange = async () => {
      try { await api("/api/admin/voz", { method: "PUT", body: { modelo: r.value } }); toast("Modelo trocado."); carregarVoz(); }
      catch (e) { toast(e.message, "erro"); carregarVoz(); }
    });
    document.getElementById("voz-testar").onclick = async function () {
      carregando(this, true);
      try {
        const r = await fetch("/api/admin/voz/amostra", { method: "POST", credentials: "same-origin",
          headers: { "Content-Type": "application/json" }, body: JSON.stringify({ texto: document.getElementById("voz-frase").value }) });
        if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || "Não gerou a amostra.");
        tocar(URL.createObjectURL(await r.blob()));
      } catch (e) { toast(e.message, "erro"); }
      carregando(this, false);
    };
  }
  document.getElementById("voz-recarregar").onclick = () => carregarVoz();
  carregarVoz();

  await carregar();
  setInterval(() => { if (!document.hidden) carregar().catch(() => {}); }, 8000);
})();
</script>
</body>
</html>
